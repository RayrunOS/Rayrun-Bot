name: Feature request
description: Propose a bot, a plugin capability, or a docs improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project is pre-alpha. Describe the user problem before the mechanism, and
        please open an issue before writing a large pull request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, or what is painful?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: When should this land?
      options:
        - v0.1 — needed for the first release
        - Later — nice to have after v0.1
        - Not sure
    validations:
      required: true
