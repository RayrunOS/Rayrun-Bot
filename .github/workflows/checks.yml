name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax-check the plugin halves
        run: |
          node --check packages/dsh-rayrun-bots/index.js
          node --check packages/dsh-rayrun-bots/client.js
      - name: Run the plain-Node checks
        run: |
          for test in packages/dsh-rayrun-bots/test/*.mjs; do
            echo "--- $test"
            node "$test"
          done
